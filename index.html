<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do.it SaaS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#3b82f6;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);transition:.3s}
.hidden{display:none}/* AUTH */ .auth{ height:100vh;display:flex;justify-content:center;align-items:center; } .auth-box{ background:var(--card);padding:30px;border-radius:12px;width:300px; box-shadow:0 10px 30px rgba(0,0,0,0.1) } .auth input{ width:100%;padding:10px;margin:8px 0;border:none;border-radius:8px;background:#f1f3f8 } .auth button{ width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer }

/* APP */ .app{display:flex} .sidebar{ width:240px;height:100vh;background:var(--card); padding:20px;border-right:1px solid rgba(0,0,0,0.05); display:flex;flex-direction:column;justify-content:space-between } .logo{font-weight:600;font-size:20px;margin-bottom:30px} .nav button{width:100%;padding:12px;border:none;background:transparent;border-radius:10px;text-align:left;cursor:pointer} .nav button:hover{background:rgba(0,0,0,0.05)} .main{flex:1;padding:25px} .header{display:flex;justify-content:space-between} .cards{display:flex;gap:15px;margin:20px 0} .card{flex:1;background:var(--card);padding:20px;border-radius:12px} .section{background:var(--card);padding:20px;border-radius:12px;margin-top:20px} .task{display:flex;justify-content:space-between;padding:10px;background:#f1f3f8;margin-top:8px;border-radius:8px} .fab{position:fixed;bottom:20px;right:20px;background:var(--primary);color:#fff;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer} .modal{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.4)} .modal-box{background:var(--card);padding:20px;border-radius:12px;width:300px} .modal input,select{width:100%;margin:8px 0;padding:10px;border:none;border-radius:8px;background:#f1f3f8} </style>

</head>
<body><!-- AUTH --><div id="auth" class="auth">
  <div class="auth-box">
    <h2>Login / Signup</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Enter</button>
  </div>
</div><!-- APP --><div id="app" class="app hidden">
  <div class="sidebar">
    <div>
      <div class="logo">Do.it</div>
      <div class="nav">
        <button onclick="show('dashboard')">Dashboard</button>
        <button onclick="show('tasks')">Tasks</button>
        <button onclick="show('settings')">Settings</button>
      </div>
    </div>
    <div>
      <p id="profile"></p>
      <button onclick="toggleTheme()">Theme</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>  <div class="main"><div id="dashboard">
  <div class="header">
    <h2 id="greet"></h2>
  </div>
  <div class="cards">
    <div class="card">Total<h2 id="total"></h2></div>
    <div class="card">Done<h2 id="done"></h2></div>
    <div class="card">Pending<h2 id="pending"></h2></div>
  </div>
  <div class="section" id="recent"></div>
</div>

<div id="tasks" class="hidden">
  <h2>Tasks</h2>
  <div id="taskList"></div>
</div>

<div id="settings" class="hidden">
  <h2>Settings</h2>
  <button onclick="toggleTheme()">Toggle Theme</button>
</div>

  </div>
</div><div class="fab hidden" id="fab" onclick="openModal()">+</div><div class="modal" id="modal">
  <div class="modal-box">
    <input id="title" placeholder="Task name">
    <select id="cat">
      <option>Work</option>
      <option>Study</option>
      <option>Personal</option>
    </select>
    <button onclick="addTask()">Add</button>
  </div>
</div><script>
let currentUser=null;

function login(){
  const u=user.value;
  const p=pass.value;
  if(!u||!p)return;

  const stored=localStorage.getItem('user_'+u);

  if(stored && stored!==p){
    alert('Wrong password');
    return;
  }

  localStorage.setItem('user_'+u,p);
  localStorage.setItem('currentUser',u);
  currentUser=u;
  init();
}

function init(){
  currentUser=localStorage.getItem('currentUser');
  if(!currentUser)return;

  auth.classList.add('hidden');
  app.classList.remove('hidden');
  fab.classList.remove('hidden');

  profile.innerText=currentUser;
  greet.innerText='Good day, '+currentUser;

  render();
}

function logout(){
  localStorage.removeItem('currentUser');
  location.reload();
}

function getTasks(){
  return JSON.parse(localStorage.getItem('tasks_'+currentUser)||'[]');
}

function saveTasks(t){
  localStorage.setItem('tasks_'+currentUser,JSON.stringify(t));
}

function openModal(){modal.style.display='flex'}
window.onclick=e=>{if(e.target==modal)modal.style.display='none'}

function addTask(){
  const t=getTasks();
  t.push({title:title.value,cat:cat.value,done:false});
  saveTasks(t);
  modal.style.display='none';
  title.value='';
  render();
}

function toggle(i){
  const t=getTasks();
  t[i].done=!t[i].done;
  saveTasks(t);
  render();
}

function del(i){
  const t=getTasks();
  t.splice(i,1);
  saveTasks(t);
  render();
}

function render(){
  const t=getTasks();
  taskList.innerHTML='';
  let doneC=0;

  t.forEach((task,i)=>{
    if(task.done)doneC++;
    const div=document.createElement('div');
    div.className='task';
    div.innerHTML=`${task.title} (${task.cat}) <span><input type='checkbox' ${task.done?'checked':''} onclick='toggle(${i})'><button onclick='del(${i})'>X</button></span>`;
    taskList.appendChild(div);
  });

  total.innerText=t.length;
  done.innerText=doneC;
  pending.innerText=t.length-doneC;

  recent.innerHTML=t.length? 'Recent: '+t.slice(0,3).map(x=>x.title).join(', ') : 'No tasks yet';
}

function show(sec){
  ['dashboard','tasks','settings'].forEach(s=>document.getElementById(s).classList.add('hidden'));
  document.getElementById(sec).classList.remove('hidden');
}

function toggleTheme(){document.body.classList.toggle('dark')}

init();
</script></body>
</html>
